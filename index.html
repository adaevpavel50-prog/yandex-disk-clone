<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МойДиск - Облачное хранилище</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Страница авторизации -->
    <div id="authPage" class="auth-container">
      <div class="auth-box">
        <h1>📁 МойДиск</h1>
        <h2 id="authTitle">Вход в аккаунт</h2>

        <div id="errorMessage" class="error-message hidden"></div>

        <form id="authForm">
          <div class="form-group" id="nameGroup" style="display: none">
            <label>Имя</label>
            <input type="text" id="nameInput" placeholder="Введите ваше имя" />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="emailInput"
              placeholder="example@mail.com"
              required
            />
          </div>

          <div class="form-group">
            <label>Пароль</label>
            <input
              type="password"
              id="passwordInput"
              placeholder="Минимум 6 символов"
              required
              minlength="6"
            />
          </div>

          <button type="submit" class="btn" id="authBtn">Войти</button>
        </form>

        <button class="btn btn-secondary" id="toggleAuthBtn">
          Создать аккаунт
        </button>
      </div>
    </div>

    <!-- Главный интерфейс диска -->
    <div id="diskPage" class="disk-container">
      <!-- Боковая панель (Sidebar) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1 class="sidebar-logo">Диск</h1>
          <button class="search-btn" title="Поиск">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </div>

        <div class="sidebar-actions">
          <button
            class="sidebar-btn upload-btn"
            onclick="document.getElementById('fileInput').click()"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Загрузить
          </button>
          <button
            class="sidebar-btn create-btn"
            onclick="showCreateFolderModal()"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Создать
          </button>
        </div>

        <nav class="sidebar-nav">
          <a
            href="#"
            class="nav-item active"
            data-section="recent"
            onclick="switchSection('recent', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Последние
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="files"
            onclick="switchSection('files', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            Файлы
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="photos"
            onclick="switchSection('photos', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            Фото
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="albums"
            onclick="switchSection('albums', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Альбомы
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="shared"
            onclick="switchSection('shared', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Общий доступ
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="family"
            onclick="switchSection('family', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Семья
            <span class="badge">+</span>
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="downloads"
            onclick="switchSection('downloads', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Загрузки
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="trash"
            onclick="switchSection('trash', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="3 6 5 6 21 6"></polyline>
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              ></path>
            </svg>
            Корзина
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="history"
            onclick="switchSection('history', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 3v5h5"></path>
              <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
              <path d="M12 7v5l4 2"></path>
            </svg>
            История
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="storage"
            onclick="switchSection('storage', this)"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
            Управление местом
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="storage-info">
            <div class="storage-bar">
              <div class="storage-bar-fill" style="width: 0.26%"></div>
            </div>
            <p class="storage-text">Занято 13,1 МБ из 5 ГБ</p>
            <button class="upgrade-btn">+1 ТБ за 1 ₽</button>
          </div>
          <button class="install-app-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Установить приложение
          </button>
        </div>
      </aside>

      <!-- Основной контент -->
      <main class="main-content">
        <!-- Верхняя панель -->
        <div class="top-bar">
          <div class="breadcrumb">
            <span id="currentPath">Мой диск</span>
          </div>
          <div class="user-info">
            <span id="userName">Привет, Пользователь</span>
            <button class="logout-btn" onclick="logout()">Выйти</button>
          </div>
        </div>

        <!-- Панель инструментов -->
        <div class="toolbar">
          <button
            class="toolbar-btn btn-primary"
            onclick="showCreateFolderModal()"
          >
            📁 Новая папка
          </button>
          <label class="toolbar-btn btn-success" style="cursor: pointer">
            ⬆️ Загрузить файл
            <input
              type="file"
              id="fileInput"
              style="display: none"
              onchange="uploadFile(event)"
            />
          </label>
        </div>

        <!-- Область контента -->
        <div class="content-area">
          <div id="emptyState" class="empty-state">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <h3>Папка пуста</h3>
            <p>Создайте папку или загрузите файл</p>
          </div>

          <div id="foldersSection" class="hidden">
            <h3 class="section-title">📁 Папки</h3>
            <div id="foldersGrid" class="folders-grid"></div>
          </div>

          <div id="filesSection" class="hidden">
            <h3 class="section-title">📄 Файлы</h3>
            <div id="filesList" class="files-list"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Модальное окно создания папки -->
    <div id="folderModal" class="modal">
      <div class="modal-content">
        <h3>Создать новую папку</h3>
        <input type="text" id="folderNameInput" placeholder="Название папки" />
        <div class="modal-buttons">
          <button class="btn-modal btn-primary-modal" onclick="createFolder()">
            Создать
          </button>
          <button
            class="btn-modal btn-secondary-modal"
            onclick="closeFolderModal()"
          >
            Отмена
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
