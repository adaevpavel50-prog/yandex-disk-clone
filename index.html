<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Диск - Практическая работа</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="authScreen" class="screen active">
        <div class="auth-box">
            <h1>☁️ МойДиск</h1>
            <h2 id="authTitle">Вход в систему</h2>
            <div id="authMessage" class="message hidden"></div>
            
            <form id="authForm">
                <div class="form-group hidden" id="nameGroup">
                    <label>Ваше имя (будет названием папки)</label>
                    <input type="text" id="regName" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" required minlength="4" placeholder="Минимум 4 символа">
                </div>
                <button type="submit" class="btn btn-primary" id="authBtn">Войти</button>
            </form>
            <button class="btn btn-secondary" id="toggleAuthBtn">Нет аккаунта? Зарегистрироваться</button>
            
            <div class="owner-hint">
                <p>🔑 Для входа как Преподаватель (Владелец):</p>
                <p>Email: <b>owner@disk.com</b> | Пароль: <b>owner123</b></p>
            </div>
        </div>
    </div>

    <!-- ЭКРАН ДИСКА (РАБОЧАЯ ОБЛАСТЬ) -->
    <div id="diskScreen" class="screen">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>☁️ МойДиск</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" id="navMyFolder">📁 Моя папка</a>
                <a href="#" class="nav-item hidden" id="navAllFolders">📂 Все папки пользователей (Владелец)</a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span id="displayUserName">Пользователь</span>
                    <span id="displayUserEmail" class="email-text"></span>
                </div>
                <button class="btn btn-logout" onclick="logout()">Выйти</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 id="pageTitle">Моя папка</h2>
                <button class="btn btn-upload" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
                    ⬆️ Загрузить файл
                </button>
                <input type="file" id="fileInput" hidden onchange="handleFileUpload(event)">
            </header>

            <div class="content-area" id="contentArea">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📂</div>
                    <h3>Папка пуста</h3>
                    <p>Загрузите первый файл, нажав кнопку выше</p>
                </div>
                <div class="items-grid" id="itemsGrid"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
