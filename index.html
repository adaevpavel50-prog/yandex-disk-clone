<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Диск</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Страница авторизации -->
    <div id="authPage" class="auth-page">
      <div class="auth-box">
        <h1>Диск</h1>
        <h2 id="authTitle">Вход в аккаунт</h2>
        <div id="errorMessage" class="error-message hidden"></div>
        <form id="authForm">
          <div class="form-group" id="nameGroup" style="display: none">
            <label>Имя</label>
            <input type="text" id="nameInput" placeholder="Ваше имя" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="emailInput"
              placeholder="example@mail.com"
              required
            />
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input
              type="password"
              id="passwordInput"
              placeholder="Минимум 6 символов"
              required
              minlength="6"
            />
          </div>
          <div
            class="form-group"
            id="confirmPasswordGroup"
            style="display: none"
          >
            <label>Подтвердите пароль</label>
            <input
              type="password"
              id="confirmPasswordInput"
              placeholder="Повторите пароль"
              minlength="6"
            />
          </div>
          <button type="submit" class="btn-auth" id="authBtn">Войти</button>
        </form>
        <button class="btn-toggle" id="toggleAuthBtn">Создать аккаунт</button>
      </div>
    </div>

    <!-- Главный интерфейс диска -->
    <div id="diskPage" class="disk-page hidden">
      <!-- Боковая панель -->
      <aside class="sidebar">
        <div class="sidebar-logo">Диск</div>

        <button
          class="sidebar-btn btn-yellow"
          onclick="document.getElementById('fileInput').click()"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Загрузить
        </button>

        <button class="sidebar-btn btn-gray" onclick="showCreateFolderModal()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Создать
        </button>

        <nav class="sidebar-nav">
          <a
            href="#"
            class="nav-item"
            data-section="myfiles"
            onclick="switchSection('myfiles', this)"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
              />
            </svg>
            Мои файлы
          </a>
          <a
            href="#"
            class="nav-item active"
            data-section="shared"
            onclick="switchSection('shared', this)"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
              />
            </svg>
            Общий доступ
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="photos"
            onclick="switchSection('photos', this)"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
              />
            </svg>
            Фото
          </a>
          <a
            href="#"
            class="nav-item"
            data-section="storage"
            onclick="switchSection('storage', this)"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"
              />
            </svg>
            Управление местом
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="storage-info">
            <div class="storage-label">
              <span>Занято</span>
              <span id="storageText">0.0 МБ из 1 ГБ</span>
            </div>
            <div class="storage-bar">
              <div
                class="storage-bar-fill"
                id="storageBar"
                style="width: 0%"
              ></div>
            </div>
          </div>
          <div class="user-profile">
            <div class="avatar" id="userAvatar">А</div>
            <div class="user-details">
              <div class="user-email" id="userEmail">user@mail.com</div>
              <button class="logout-link" onclick="logout()">Выйти</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Основной контент -->
      <main class="main-content">
        <div class="top-bar">
          <h1 id="pageTitle">Общий доступ</h1>
          <div class="top-actions">
            <span class="file-status" id="fileStatus">Файл не выбран</span>
            <button
              class="btn-upload-top"
              onclick="document.getElementById('fileInput').click()"
            >
              Загрузить файл
            </button>
          </div>
        </div>

        <div class="content-area">
          <div id="emptyState" class="empty-state hidden">
            <svg
              width="80"
              height="80"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ccc"
              stroke-width="1"
            >
              <path
                d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
              ></path>
            </svg>
            <h3>Папка пуста</h3>
            <p>Загрузите файлы или создайте папку</p>
          </div>

          <div id="foldersGrid" class="folders-grid"></div>
          <div id="filesList" class="files-list"></div>
        </div>
      </main>
    </div>

    <!-- Модальное окно создания папки -->
    <div id="folderModal" class="modal hidden">
      <div class="modal-content">
        <h3>Создать папку</h3>
        <input type="text" id="folderNameInput" placeholder="Название папки" />
        <div class="modal-buttons">
          <button class="btn-modal btn-primary" onclick="createFolder()">
            Создать
          </button>
          <button class="btn-modal btn-cancel" onclick="closeFolderModal()">
            Отмена
          </button>
        </div>
      </div>
    </div>

    <input
      type="file"
      id="fileInput"
      style="display: none"
      onchange="handleFileUpload(event)"
    />

    <script src="script.js"></script>
  </body>
</html>
